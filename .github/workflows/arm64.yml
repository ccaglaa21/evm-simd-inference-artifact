# Runs the artifact on a 64-bit ARM machine (GitHub-hosted runner), three times in a row. Each run builds the
# vector library (NEON) and the scalar fallback library, compares every gas and security output with the x86-64
# reference outputs committed in outputs/, and compares the two builds with each other. When the workflow is
# started by hand (Run workflow), the outputs of the three runs are committed to outputs/arm64 and
# outputs/scaling_runs. The view experiments (run_views.sh: gram_views, three runs on each build) run in every
# case. A run started by hand has a scope: "views" (the default) runs and commits only the view experiments and
# leaves the committed outputs of the other programs as they are, "all" runs and commits everything.
name: arm64-equivalence
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "views = only the view experiments (gram_views); all = every program"
        type: choice
        options: [views, all]
        default: views
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          uname -m
          lscpu | grep -E "Architecture|Model name|Vendor ID|Flags" | cut -c1-300
      - name: Build the image
        run: docker build -t evmone-simd .
      - name: Run the gas and security programs on both builds, three times
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        run: |
          for r in 1 2 3; do
            mkdir -p out_arm64_$r
            docker run --rm -e RUN_SCALING=1 -e RUN_FALLBACK=1 -v "$PWD/out_arm64_$r:/out" evmone-simd sh /work/evmone/run_all.sh > run_$r.log 2>&1
            echo "run $r finished, exit status $?"
            grep -c "rc=[1-9]" out_arm64_$r/MANIFEST.txt || true
          done
      - name: Compare with the x86-64 reference outputs
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        run: |
          for r in 1 2 3; do
            sh compare_outputs.sh outputs out_arm64_$r ARM64_COMPARISON_$r.txt | tail -n 1
          done
          grep -c "^identical" ARM64_COMPARISON_1.txt ARM64_COMPARISON_2.txt ARM64_COMPARISON_3.txt
          ! grep -E "^(DIFFERENT|MISSING)" ARM64_COMPARISON_1.txt ARM64_COMPARISON_2.txt ARM64_COMPARISON_3.txt
      - name: Vector build and fallback build on this machine
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        run: |
          for r in 1 2 3; do
            echo "======== run $r ========"
            grep -E "sqadd|fallback library|fallback comparison" out_arm64_$r/MANIFEST.txt
            echo "---- vector build, timing table ----"
            sed -n '/^TIME/,$p' out_arm64_$r/rowmacc_scaling.txt
            echo "---- fallback build, timing table ----"
            sed -n '/^TIME/,$p' out_arm64_$r/fallback/rowmacc_scaling.txt
          done
      - name: View experiments, three runs on both builds
        run: |
          mkdir -p out_views
          docker run --rm -v "$PWD/out_views:/out" evmone-simd sh /work/evmone/run_views.sh > run_views.log 2>&1 || { tail -n 30 run_views.log; exit 1; }
          tail -n 12 run_views.log
          det() { awk '/^TIME/{s=1} /^$/{s=0} !s' "$1" | grep -v 'med='; }
          if [ -f outputs/scaling_runs/x86_run1_gram_avx2.txt ]; then
            if [ "$(det out_views/arm64_run1_gram_neon.txt)" = "$(det outputs/scaling_runs/x86_run1_gram_avx2.txt)" ]; then
              echo "identical to the x86-64 reference (gas tables and check lines of gram_views)"
            else
              echo "DIFFERENT from the x86-64 reference (gas tables or check lines of gram_views)"; exit 1
            fi
          else
            echo "no x86-64 reference of gram_views in outputs/scaling_runs yet; comparison skipped"
          fi
          for b in neon scalar; do
            echo "---- $b build, timing table of run 1 ----"
            sed -n '/^TIME (median/,/^$/p' out_views/arm64_run1_gram_$b.txt
          done
      - name: Collect the outputs of the view experiments
        run: |
          mkdir -p outputs/scaling_runs
          cp out_views/arm64_run*_gram_*.txt outputs/scaling_runs/
          ls -la outputs/scaling_runs
      - name: Collect the outputs
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        run: |
          mkdir -p outputs/arm64 outputs/scaling_runs
          for r in 1 2 3; do
            cp out_arm64_$r/rowmacc_scaling.txt outputs/scaling_runs/arm64_run${r}_neon.txt
            cp out_arm64_$r/fallback/rowmacc_scaling.txt outputs/scaling_runs/arm64_run${r}_scalar.txt
            cp ARM64_COMPARISON_$r.txt outputs/arm64/ARM64_COMPARISON_run$r.txt
            cp out_arm64_$r/FALLBACK_COMPARISON.txt outputs/arm64/FALLBACK_COMPARISON_run$r.txt
            cp out_arm64_$r/MANIFEST.txt outputs/arm64/MANIFEST_run$r.txt
          done
          { uname -m; lscpu; } > outputs/arm64/MACHINE.txt
          ls -la outputs/arm64 outputs/scaling_runs
      - name: Commit the outputs (only when started by hand)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.scope }}" = "all" ]; then
            git add outputs/arm64 outputs/scaling_runs
          else
            git add outputs/scaling_runs/arm64_run*_gram_*.txt
          fi
          git commit -m "Outputs of the 64-bit ARM runner (NEON build and scalar fallback build, scope: ${{ inputs.scope }}), written by the arm64-equivalence workflow"
          git push
      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out_arm64
          path: |
            outputs/arm64
            outputs/scaling_runs
