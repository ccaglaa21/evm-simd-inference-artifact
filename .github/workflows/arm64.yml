# Runs the artifact on a 64-bit ARM machine (GitHub-hosted runner): the vector build (NEON path of the row-level
# instructions) and the scalar fallback build. Every gas and security output is compared with the x86-64
# reference outputs committed in outputs/, and the two builds are compared with each other.
name: arm64-equivalence
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          uname -m
          lscpu | grep -E "Architecture|Model name|Vendor ID|Flags" | cut -c1-300
      - name: Build the image
        run: docker build -t evmone-simd .
      - name: Run the gas and security programs on both builds
        run: |
          mkdir -p out_arm64
          docker run --rm -e RUN_SCALING=1 -e RUN_FALLBACK=1 -v "$PWD/out_arm64:/out" evmone-simd sh /work/evmone/run_all.sh
      - name: Compare with the x86-64 reference outputs
        run: sh compare_outputs.sh outputs out_arm64 out_arm64/ARM64_COMPARISON.txt
      - name: Vector build and fallback build on this machine
        run: |
          grep -E "sqadd|ymm|fallback library|fallback comparison|rowmacc_scaling" out_arm64/MANIFEST.txt
          cat out_arm64/FALLBACK_COMPARISON.txt
          echo "---- vector build, timing table ----"
          sed -n '/^TIME/,$p' out_arm64/rowmacc_scaling.txt
          echo "---- fallback build, timing table ----"
          sed -n '/^TIME/,$p' out_arm64/fallback/rowmacc_scaling.txt
      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out_arm64
          path: out_arm64
